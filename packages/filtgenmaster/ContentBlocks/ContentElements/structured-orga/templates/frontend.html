<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
    data-namespace-typo3-fluid="true"
    xmlns:schema="http://typo3.org/ns/Brotkrueml/Schema/ViewHelpers" data-namespace-typo3-fluid="true"
>

<f:debug>{data}</f:debug>

<schema:type.organization
    url ="{data.orga_url}"
    sameAs = "{data.orga_url}"
    logo = "{f:uri.image(image: data.image.0)}"
    name = "{data.orga_name}"
    description = "{data.orga_description}"
    email = "{data.orga_email}"
>
    <schema:type.postalAddress
        -as ="address"
        addressCountry = "{data.orga_country}"
        addressLocality = "{data.orga_local}"
        addressRegion = "{data.orga_state}"
        postalCode = "{data.orga_postal}"
        streetAddress = "{data.orga_street_and_number}"

    >

    </schema:type.postalAddress>

</schema:type.organization>
 


</html>
