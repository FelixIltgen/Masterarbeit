<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
    data-namespace-typo3-fluid="true"
>
<section class="section section--alt" id="events">
    <div class="container">
      <div class="section-head">
        <div class="section-head__left">
          <div class="overline section-head__overline">
            <span class="lehm-line"></span>
            Kommende Events
          </div>
          <h2 class="section-head__title">Diesen Monat in Baden-Württemberg.</h2>
          <p class="section-head__sub">Kleine Gruppen. Erfahrene Guides. Materialien sind inklusive — du brauchst nichts mitzubringen.</p>
        </div>
        <f:link.typolink class="section-head__link" parameter="{data.bttn_link_1}">
          Alle Events ansehen
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </f:link.typolink>
      </div>
      <div class="events-grid" id="landing-events"></div>
    </div>
  </section>
</html>
