<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
    data-namespace-typo3-fluid="true"
>

<section class="section section--dark section--testimonials" id="stimmen">
    <div class="container">
      <div class="section-head" style="margin-bottom:28px">
        <div class="section-head__left" style="margin:0 auto;text-align:center;max-width:none">
          <div class="overline section-head__overline" style="justify-content:center;margin-bottom:10px">
            <span class="lehm-line"></span>
            Stimmen aus den Studios
            <span class="lehm-line"></span>
          </div>
          <h2 class="section-head__title" style="font-size:28px">Was unsere Teilnehmer sagen.</h2>
        </div>
      </div>

      <div class="testimonial" id="testimonial-slide"></div>

      <div class="testimonial__nav">
        <button class="testimonial__arrow" id="t-prev" aria-label="Vorheriges Zitat">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
        </button>
        <div class="testimonial__dots" id="t-dots"></div>
        <button class="testimonial__arrow" id="t-next" aria-label="Nächstes Zitat">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
      </div>
    </div>
  </section>
</html>
