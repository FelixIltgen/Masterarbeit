<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
    data-namespace-typo3-fluid="true"
>
  <section class="subpage-hero">
    <div class="container">
      <div class="overline" style="margin-bottom:20px">
        <span class="lehm-line lehm-line--lg"></span>
        <f:if condition="{data.checkbox} == 1">
          <f:then>
            {data.text_over_header} &amp; {data.text_over_header2}
          </f:then>
          <f:else>
            {data.text_over_header}
          </f:else>
        </f:if>
      </div>
      <h1 class="subpage-hero__title">{data.header_text_1}</h1>
      <p class="subpage-hero__body">{data.text_under_header}</p>
      <f:format.html>{data.textarea_text}</f:format.html>
    </div>
  </section>
</html>
