name: filtgen/event-list
typeName: filtgen_eventlist
group: default
prefixFields: false
prefixType: full
fields:
  - identifier: header 
    label: Header
    description: Wird nicht angezeigt, sondern nur für die interne Sortierung der Events verwendet.
    useExistingField: true
  - identifier: use_on_homepage
    label: Auf Startseite anzeigen
    description: Wenn aktiviert, werden nur die ersten 3 Events angezeigt. Dies soll nur verwendet werden wenn das Element auf der Startseite genutzt wird.
    type: Checkbox
  - identifier: events
    type: Collection
    labellfield: title
    appearance:
      collapseAll: true
      levelLinksPosition: both
    fields:
      - identifier: title
        type: Text
        label: Titel des Events
      - identifier: image
        label: Teaser Bild des Events
        type: File
        extendedPalette: false
        allowed: common-image-types
      - identifier: link
        type: Link
        label: Link zum Event
        allowedTypes:
          - page
          - url
      - identifier: event_bage
        label: Bage im Teaserbild
        type: Text
      - identifier: event_price
        type: Text
        label: Preis des Events
      - identifier: event_place
        type: Text
        label: Ort des Events
      - identifier: event_small_description
        type: Text
        label: Kurze Beschreibung des Events
      - identifier: event_date
        type: DateTime
        label: Datum des Events
        format: datetime
        dbType: datetime
      - identifier: event_street_location
        type: Text
        label: Hausnummer und Straße des Events
      - identifier: event_ocupation
        type: Text
        label: Belegung des Events

  
    